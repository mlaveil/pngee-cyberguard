name: CyberGuard v3 CI

on:
  push:
    branches: [main, v3-production-foundation]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Verify production runtime is durable-only
        run: |
          ! grep -R -n --exclude-dir=node_modules --exclude='seed.ts' --exclude='store.ts' "db/store\|services/detectionEngine\|services/agentService\|services/testRunner\|services/disasterRecovery\|routes/api\|routes/agent" server.ts server
          grep -q "durablePlatformRouter" server.ts
          grep -q "durableApiRouter" server.ts
          grep -q "durableAgentRouter" server.ts
          grep -q "durableIngestRouter" server.ts

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: pngee_cyberguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pngee_cyberguard"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Create migration and application roles
        run: |
          CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -1)"
          test -n "$CONTAINER"
          docker exec "$CONTAINER" psql -U postgres -d pngee_cyberguard -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE pngee_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-migrator-password';" \
            -c "CREATE ROLE pngee_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-app-password';" \
            -c "GRANT CONNECT ON DATABASE pngee_cyberguard TO pngee_migrator, pngee_app;" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO pngee_migrator;" \
            -c "GRANT USAGE ON SCHEMA public TO pngee_app;"
      - name: Run database migrations
        run: npm run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://pngee_migrator:ci-migrator-password@127.0.0.1:5432/pngee_cyberguard
      - name: Grant application database privileges
        run: |
          CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -1)"
          docker exec "$CONTAINER" psql -U postgres -d pngee_cyberguard -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO pngee_app;" \
            -c "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO pngee_app;"
      - name: Verify application role is not privileged
        run: |
          CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -1)"
          docker exec "$CONTAINER" psql -U postgres -d pngee_cyberguard -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'pngee_app' AND rolsuper = false AND rolbypassrls = false) THEN RAISE EXCEPTION 'pngee_app must be NOSUPERUSER and NOBYPASSRLS'; END IF; END \$\$;"
      - run: npm run db:health
        env:
          DATABASE_URL: postgresql://pngee_app:ci-app-password@127.0.0.1:5432/pngee_cyberguard
      - run: npm run db:rls-test
        env:
          DATABASE_URL: postgresql://pngee_app:ci-app-password@127.0.0.1:5432/pngee_cyberguard
      - run: npm run db:durable-test
        env:
          DATABASE_URL: postgresql://pngee_app:ci-app-password@127.0.0.1:5432/pngee_cyberguard
      - name: Run MFA primitive tests
        run: npm run db:mfa-test
        env:
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-characters-long
